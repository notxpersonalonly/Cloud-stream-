name: Build Plugins

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v3
        with:
          path: master

      - name: Checkout builds
        uses: actions/checkout@v3
        with:
          ref: builds
          path: builds

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build plugins
        run: |
          cd master
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Push to builds branch
        run: |
          cp -r master/builds/. builds/
          cd builds
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build plugins from ${{ github.sha }}" || echo "Nothing to commit"
          git push
