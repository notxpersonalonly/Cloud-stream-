name: Extract CNCVerse ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o "CNCVerse-Clean-Extension.zip" -d extracted

      - name: Copy extracted files to root
        run: |
          cp -r extracted/. .
          rm -rf extracted
          rm -f "CNCVerse-Clean-Extension.zip"

      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Extract CNCVerse Clean Extension" || echo "No changes to commit"
          git push origin main
